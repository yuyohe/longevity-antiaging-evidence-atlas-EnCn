name: Publish to Feishu

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-feishu.yml"
      - "data/evidence_matrix.csv"
      - "config/feishu_field_mapping.json"
      - "scripts/sync_feishu_bitable.py"

jobs:
  publish-feishu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Check optional Feishu configuration
        id: feishu_config
        env:
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
          FEISHU_BITABLE_APP_TOKEN: ${{ secrets.FEISHU_BITABLE_APP_TOKEN }}
          FEISHU_SOURCE_TABLE_ID: ${{ secrets.FEISHU_SOURCE_TABLE_ID }}
        run: |
          if [[ -n "$FEISHU_APP_ID" && -n "$FEISHU_APP_SECRET" && -n "$FEISHU_BITABLE_APP_TOKEN" && -n "$FEISHU_SOURCE_TABLE_ID" ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Optional Feishu publishing skipped: required repository secrets are not configured. No online sync was performed by this workflow."
          fi
      - name: Sync evidence matrix to Feishu Base
        if: steps.feishu_config.outputs.ready == 'true'
        env:
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
          FEISHU_BITABLE_APP_TOKEN: ${{ secrets.FEISHU_BITABLE_APP_TOKEN }}
          FEISHU_SOURCE_TABLE_ID: ${{ secrets.FEISHU_SOURCE_TABLE_ID }}
        run: python scripts/sync_feishu_bitable.py
